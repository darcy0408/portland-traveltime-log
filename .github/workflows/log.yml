# Hourly travel-time logger. GitHub's cron can drift a few minutes under
# load; that is fine, the CSV records the true UTC timestamp per row.
#
# Six cron entries per hour (three added Aug 27 2026, doubled to six Sept 9
# 2026): on Aug 26 GitHub's scheduler began starving the single hourly slot
# (runs that fired completed clean in ~25 s; most hours never fired at all,
# Aug 26 logged 5 of 14 daytime hours). The extra entries are pure redundancy
# against scheduler starvation; an hour guard in log_traveltimes.py keeps the
# data definition unchanged at most ONE row set per UTC hour, whichever run
# fires first.
#
# Sept 9 2026, measured and disclosed BEFORE the Sept 11 closure, so this
# change precedes any contact with closure data. The three Aug 27 slots did
# not cure the starvation. Over Sept 1-8, GitHub's own cron delivered only
# 32% of daytime hours (3 to 5 of 14 per day); the remaining 68% exist only
# because a local Windows task pings `gh workflow run` at :52, last in the
# hour, so every hour it delivered is an hour all three cron slots missed.
# That made an unattended PC a single point of failure for irreplaceable
# closure data. Two changes were made that day: the local task's
# battery-stop conditions were cleared, and these slots went from 3 to 6,
# spaced ~8 min apart and all BEFORE :52 so the pinger stays the backstop
# rather than the primary. Neither touches the data definition: the hour
# guard returns before querying the API, so extra slots add no rows and no
# API calls, and `concurrency: logger` serializes runs so they cannot race.
#
# Sept 15 2026 re-measure, after the closure began: over Sept 9-15, with the
# six slots above, GitHub's cron delivered about 30% of scored-window hours
# (06:00-19:59 PT) and the local pinger about 70% (Sept 9-13, complete days:
# 30.0% / 70.0%); this is an observed trigger-share measurement only and
# changes no cron slot, no data definition, and no scoring rule.
#
# Sept 28 2026 (Pacific date; the commit is stamped Sept 29 UTC), disclosed
# during the closure, after the fact: two trigger changes made during
# collection that the paragraphs above do not describe
# (they stay as written). (1) Since Sept 14 the local Windows task fires
# twice an hour, at :20 and :52 (first :20 dispatch 2026-09-15 00:20Z), so
# ":52, last in the hour" above is out of date. (2) Since 2026-09-16 01:11Z
# (Sept 15, 18:11 PDT) a Cloudflare Worker, "logger-watchdog", requests a
# workflow_dispatch at :50 UTC every hour and sends a private alert if that
# dispatch fails or a scored-window hour has no rows. It never writes to
# this repository: like every trigger it only starts this workflow, and the
# hour guard still keeps at most one row set per UTC hour. Measured on runs
# and rows before 2026-09-28 23:00Z (snapshot commit db6c328, the first
# after that cutoff) from GitHub's run records and this repository's commits
# (each data commit falls inside exactly one run): all 179 scored-window
# hours from 02:00Z Sept 16 were first recorded by dispatch runs created at
# :20-:21 (161) or by scheduled runs (18); every dispatch run created at
# :50-:51 (308) exited at the hour guard. The PC task and the Worker share
# one GitHub account, so which caller made a dispatch is INFERRED from its
# creation minute; on that inference no hour was first recorded by a
# Worker-triggered run, and the records cannot make that certain. The :20
# slot moved the typical sample from about :49 to about :20 past the hour
# between the preregistration's before and during pools; the rules are
# unchanged and that shift is disclosed, not corrected. No closure-period
# scoring output or record of scoring was found in the materials reviewed.
# Registered as Appendix Q addendum 5 in the ABM repository's
# PREREG_I5_ROSEQUARTER.md.
name: log-traveltimes
on:
  schedule:
    - cron: "3,11,19,27,35,43 * * * *"
  workflow_dispatch: {}      # manual run button, for smoke tests and gap fill

permissions:
  contents: write

concurrency:
  group: logger              # never let two runs race the same CSV
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: log one sample per pair
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python3 log_traveltimes.py
      - name: commit the new rows
        run: |
          git config user.name "traveltime-logger"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "log $(date -u +%FT%H:%MZ)" || exit 0
          git pull --rebase
          git push
